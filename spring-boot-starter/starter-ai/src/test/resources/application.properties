camunda.bpm.process-engine-name=testEngine
camunda.bpm.job-execution.enabled=false
camunda.bpm.database.schema-update=true

# Two provider starters are on the test classpath; Ollama is active unless a test selects another
spring.ai.model.chat=ollama
# Only chat models are under test; the OpenAI starter would otherwise create these too
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
