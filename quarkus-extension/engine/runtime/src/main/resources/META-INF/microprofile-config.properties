# juel is shaded (jakarta.el -> io.orqueio.bpm.impl.juel.jakarta.el) at package
# time, so target/classes holds pre-shade bytecode. Quarkus workspace classloading
# would otherwise pick up that unshaded bytecode and cause a VerifyError at runtime.
# Loading juel parent-first forces Quarkus to use the shaded JAR from .m2 instead.
quarkus.class-loading.parent-first-artifacts=io.orqueio.bpm.juel:orqueio-juel
