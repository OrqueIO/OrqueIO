<nav class="navbar" [class.transparent]="transparent">
  <div class="navbar-container">
    <a routerLink="/" class="navbar-logo">
      <img src="images/orqueio.png" alt="OrqueIO Logo" class="logo-image">
    </a>

    <!-- Menu Items -->
    <div class="navbar-menu" *ngIf="menuItems.length > 0 || moreMenuItems.length > 0">
      <a
        *ngFor="let item of menuItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        class="menu-item"
      >
        <fa-icon [icon]="item.icon" class="menu-icon"></fa-icon>
        <span class="menu-label">{{ item.label | translate }}</span>
      </a>

      <!-- More Dropdown -->
      <div class="more-dropdown" *ngIf="moreMenuItems.length > 0">
        <button
          type="button"
          class="menu-item more-toggle"
          [class.open]="moreMenuOpen"
          (click)="toggleMoreMenu($event)"
        >
          <fa-icon [icon]="faEllipsisH" class="menu-icon"></fa-icon>
          <span class="menu-label">{{ 'cockpit.menu.more' | translate }}</span>
          <fa-icon [icon]="faChevronDown" class="chevron" [class.rotated]="moreMenuOpen"></fa-icon>
        </button>

        <div class="more-menu" *ngIf="moreMenuOpen">
          <a
            *ngFor="let item of moreMenuItems"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            class="more-menu-item"
            (click)="closeMoreMenu()"
          >
            <fa-icon [icon]="item.icon" class="menu-icon"></fa-icon>
            <span class="menu-label">{{ item.label | translate }}</span>
          </a>
        </div>
      </div>
    </div>

    <div class="navbar-actions">
      <!-- Dynamic Action Buttons -->
      <div class="nav-action-buttons" *ngIf="navActions.length > 0">
        <button
          *ngFor="let action of navActions"
          type="button"
          class="nav-action-btn"
          [class.primary]="action.primary"
          (click)="onActionClick(action)"
          [title]="action.label | translate"
        >
          <span class="action-icon" *ngIf="action.svgIcon" [innerHTML]="sanitizeSvg(action.svgIcon)"></span>
          <span class="action-label">{{ action.label | translate }}</span>
        </button>
      </div>

      <!-- Language Dropdown -->
      <div class="language-dropdown">
        <button
          type="button"
          class="lang-toggle"
          [class.open]="languageMenuOpen"
          (click)="toggleLanguageMenu($event)"
          [attr.aria-expanded]="languageMenuOpen"
          aria-haspopup="listbox"
          [title]="getCurrentLanguageOption().label"
        >
          <span class="lang-flag" [innerHTML]="sanitizeSvg(getCurrentLanguageOption().flag)"></span>
          <span class="lang-label">{{ getCurrentLanguageOption().shortLabel }}</span>
          <fa-icon [icon]="faChevronDown" class="lang-caret" [class.rotated]="languageMenuOpen"></fa-icon>
        </button>

        <ul class="language-menu" *ngIf="languageMenuOpen" role="listbox">
          <li
            *ngFor="let lang of languageOptions"
            role="option"
            [attr.aria-selected]="lang.value === currentLang"
            class="language-menu-item"
            [class.active]="lang.value === currentLang"
            (click)="selectLanguage(lang.value, $event)"
          >
            <span class="lang-flag" [innerHTML]="sanitizeSvg(lang.flag)"></span>
            <span class="lang-name">{{ lang.label }}</span>
            <fa-icon
              *ngIf="lang.value === currentLang"
              [icon]="faCheck"
              class="lang-check"
            ></fa-icon>
          </li>
        </ul>
      </div>

      <ng-container *ngIf="showAuth && isAuthenticated">
        <a routerLink="/profile" class="nav-link profile-link">
          <span class="nav-icon">
            <fa-icon [icon]="faUser"></fa-icon>
          </span>
          <span class="nav-username">{{ userName }}</span>
        </a>

        <button type="button" class="logout-btn" (click)="onLogout()" [title]="'LOGOUT' | translate">
          <fa-icon [icon]="faSignOut"></fa-icon>
        </button>
      </ng-container>
    </div>
  </div>
</nav>
